
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Download Review Drawing Plugin</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f7f9ff;
      background: radial-gradient(circle at top left, #12304c, transparent 42%), #080d16;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(440px, 100%);
      padding: 32px;
      border: 1px solid rgba(121, 145, 181, .24);
      border-radius: 18px;
      background: rgba(16, 22, 32, .94);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .36);
      text-align: center;
    }
    .mark {
      display: grid;
      width: 50px;
      height: 50px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #3476ff, #4836de);
      font-size: 20px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 22px; color: #93a1b8; font-size: 14px; line-height: 1.55; }
    a {
      display: inline-grid;
      width: 100%;
      min-height: 46px;
      place-items: center;
      border: 1px solid rgba(133, 163, 255, .46);
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #3975f5, #294ed5);
      box-shadow: 0 14px 34px rgba(42, 86, 220, .28);
      font-weight: 750;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.12); }
    a:focus-visible { outline: 2px solid #8eb4ff; outline-offset: 3px; }
    small { display: block; margin-top: 14px; color: #738198; }
  </style>
</head>
<body>
  <main>
    <div class="mark">A</div>
    <h1>Review Drawing Plugin</h1>
    <p id="message">Preparing your download…</p>
    <a id="download" href="/assets/review-drawing.rbxmx" download="review-drawing.rbxmx">Download plugin</a>
    <small>Alvin's Creationz Staff</small>
  </main>
  <script>
    (() => {
      "use strict";
      const download = document.getElementById("download");
      const message = document.getElementById("message");
      const assetUrl = "/assets/review-drawing.rbxmx";
      let downloading = false;

      async function downloadAndClose() {
        if (downloading) return;
        downloading = true;
        download.setAttribute("aria-disabled", "true");
        message.textContent = "Downloading Review Drawing Plugin…";

        try {
          const response = await fetch(assetUrl, { cache: "no-store" });
          if (!response.ok) throw new Error(`Download failed (${response.status})`);
          const file = await response.blob();
          if (!file.size) throw new Error("The downloaded file was empty.");

          const objectUrl = URL.createObjectURL(file);
          const save = document.createElement("a");
          save.href = objectUrl;
          save.download = "review-drawing.rbxmx";
          save.hidden = true;
          document.body.appendChild(save);
          save.click();
          save.remove();

          message.textContent = "Download started successfully. Closing this tab…";
          window.setTimeout(() => {
            window.close();
            window.setTimeout(() => {
              URL.revokeObjectURL(objectUrl);
              message.textContent = "Download complete. Your browser did not allow this tab to close automatically, so you may close it now.";
            }, 300);
          }, 1200);
        } catch (error) {
          downloading = false;
          download.removeAttribute("aria-disabled");
          message.textContent = `${error.message || "Download failed."} Select Download plugin to try again.`;
        }
      }

      download.addEventListener("click", (event) => {
        event.preventDefault();
        downloadAndClose();
      });
      window.setTimeout(downloadAndClose, 150);
    })();
  </script>
</body>
</html>
