<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Source</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      margin: 0;
      padding: 24px;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 400px;
      margin-top: 16px;
      box-sizing: border-box;
      padding: 12px;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
      background: #f9fafb;
      color: #111827;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enter Code</h1>

    <label for="codeInput">Code</label>
    <input id="codeInput" type="password" placeholder="Type code here" />

    <button id="submitBtn">Submit</button>

    <div id="status" class="status"></div>

    <textarea id="resultBox" class="hidden" readonly></textarea>
  </div>

  <script>
    async function md5(message) {
      /*
        Web Crypto does not support MD5 directly,
        so this is a small JS MD5 implementation.
      */

      function rotateLeft(lValue, iShiftBits) {
        return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
      }

      function addUnsigned(lX, lY) {
        const lX4 = lX & 0x40000000;
        const lY4 = lY & 0x40000000;
        const lX8 = lX & 0x80000000;
        const lY8 = lY & 0x80000000;
        const lResult = (lX & 0x3fffffff) + (lY & 0x3fffffff);

        if (lX4 & lY4) {
          return lResult ^ 0x80000000 ^ lX8 ^ lY8;
        }

        if (lX4 | lY4) {
          if (lResult & 0x40000000) {
            return lResult ^ 0xc0000000 ^ lX8 ^ lY8;
          } else {
            return lResult ^ 0x40000000 ^ lX8 ^ lY8;
          }
        }

        return lResult ^ lX8 ^ lY8;
      }

      function f(x, y, z) {
        return (x & y) | (~x & z);
      }

      function g(x, y, z) {
        return (x & z) | (y & ~z);
      }

      function h(x, y, z) {
        return x ^ y ^ z;
      }

      function i(x, y, z) {
        return y ^ (x | ~z);
      }

      function ff(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(f(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }

      function gg(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(g(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }

      function hh(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(h(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }

      function ii(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(i(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }

      function convertToWordArray(string) {
        const lWordCount = [];
        const lMessageLength = string.length;
        const lNumberOfWordsTemp1 = lMessageLength + 8;
        const lNumberOfWordsTemp2 =
          (lNumberOfWordsTemp1 - (lNumberOfWordsTemp1 % 64)) / 64;
        const lNumberOfWords = (lNumberOfWordsTemp2 + 1) * 16;

        for (let i = 0; i < lNumberOfWords; i++) {
          lWordCount[i] = 0;
        }

        let lBytePosition = 0;
        let lByteCount = 0;

        while (lByteCount < lMessageLength) {
          const lWordCountIndex = (lByteCount - (lByteCount % 4)) / 4;
          lBytePosition = (lByteCount % 4) * 8;
          lWordCount[lWordCountIndex] =
            lWordCount[lWordCountIndex] |
            (string.charCodeAt(lByteCount) << lBytePosition);
          lByteCount++;
        }

        const lWordCountIndex = (lByteCount - (lByteCount % 4)) / 4;
        lBytePosition = (lByteCount % 4) * 8;
        lWordCount[lWordCountIndex] =
          lWordCount[lWordCountIndex] | (0x80 << lBytePosition);

        lWordCount[lNumberOfWords - 2] = lMessageLength << 3;
        lWordCount[lNumberOfWords - 1] = lMessageLength >>> 29;

        return lWordCount;
      }

      function wordToHex(lValue) {
        let wordToHexValue = "";
        for (let lCount = 0; lCount <= 3; lCount++) {
          const lByte = (lValue >>> (lCount * 8)) & 255;
          const wordToHexValueTemp = "0" + lByte.toString(16);
          wordToHexValue += wordToHexValueTemp.slice(-2);
        }
        return wordToHexValue;
      }

      function utf8Encode(string) {
        return unescape(encodeURIComponent(string));
      }

      const x = convertToWordArray(utf8Encode(message));

      let a = 0x67452301;
      let b = 0xefcdab89;
      let c = 0x98badcfe;
      let d = 0x10325476;

      for (let k = 0; k < x.length; k += 16) {
        const AA = a;
        const BB = b;
        const CC = c;
        const DD = d;

        a = ff(a, b, c, d, x[k + 0], 7, 0xd76aa478);
        d = ff(d, a, b, c, x[k + 1], 12, 0xe8c7b756);
        c = ff(c, d, a, b, x[k + 2], 17, 0x242070db);
        b = ff(b, c, d, a, x[k + 3], 22, 0xc1bdceee);
        a = ff(a, b, c, d, x[k + 4], 7, 0xf57c0faf);
        d = ff(d, a, b, c, x[k + 5], 12, 0x4787c62a);
        c = ff(c, d, a, b, x[k + 6], 17, 0xa8304613);
        b = ff(b, c, d, a, x[k + 7], 22, 0xfd469501);
        a = ff(a, b, c, d, x[k + 8], 7, 0x698098d8);
        d = ff(d, a, b, c, x[k + 9], 12, 0x8b44f7af);
        c = ff(c, d, a, b, x[k + 10], 17, 0xffff5bb1);
        b = ff(b, c, d, a, x[k + 11], 22, 0x895cd7be);
        a = ff(a, b, c, d, x[k + 12], 7, 0x6b901122);
        d = ff(d, a, b, c, x[k + 13], 12, 0xfd987193);
        c = ff(c, d, a, b, x[k + 14], 17, 0xa679438e);
        b = ff(b, c, d, a, x[k + 15], 22, 0x49b40821);

        a = gg(a, b, c, d, x[k + 1], 5, 0xf61e2562);
        d = gg(d, a, b, c, x[k + 6], 9, 0xc040b340);
        c = gg(c, d, a, b, x[k + 11], 14, 0x265e5a51);
        b = gg(b, c, d, a, x[k + 0], 20, 0xe9b6c7aa);
        a = gg(a, b, c, d, x[k + 5], 5, 0xd62f105d);
        d = gg(d, a, b, c, x[k + 10], 9, 0x02441453);
        c = gg(c, d, a, b, x[k + 15], 14, 0xd8a1e681);
        b = gg(b, c, d, a, x[k + 4], 20, 0xe7d3fbc8);
        a = gg(a, b, c, d, x[k + 9], 5, 0x21e1cde6);
        d = gg(d, a, b, c, x[k + 14], 9, 0xc33707d6);
        c = gg(c, d, a, b, x[k + 3], 14, 0xf4d50d87);
        b = gg(b, c, d, a, x[k + 8], 20, 0x455a14ed);
        a = gg(a, b, c, d, x[k + 13], 5, 0xa9e3e905);
        d = gg(d, a, b, c, x[k + 2], 9, 0xfcefa3f8);
        c = gg(c, d, a, b, x[k + 7], 14, 0x676f02d9);
        b = gg(b, c, d, a, x[k + 12], 20, 0x8d2a4c8a);

        a = hh(a, b, c, d, x[k + 5], 4, 0xfffa3942);
        d = hh(d, a, b, c, x[k + 8], 11, 0x8771f681);
        c = hh(c, d, a, b, x[k + 11], 16, 0x6d9d6122);
        b = hh(b, c, d, a, x[k + 14], 23, 0xfde5380c);
        a = hh(a, b, c, d, x[k + 1], 4, 0xa4beea44);
        d = hh(d, a, b, c, x[k + 4], 11, 0x4bdecfa9);
        c = hh(c, d, a, b, x[k + 7], 16, 0xf6bb4b60);
        b = hh(b, c, d, a, x[k + 10], 23, 0xbebfbc70);
        a = hh(a, b, c, d, x[k + 13], 4, 0x289b7ec6);
        d = hh(d, a, b, c, x[k + 0], 11, 0xeaa127fa);
        c = hh(c, d, a, b, x[k + 3], 16, 0xd4ef3085);
        b = hh(b, c, d, a, x[k + 6], 23, 0x04881d05);
        a = hh(a, b, c, d, x[k + 9], 4, 0xd9d4d039);
        d = hh(d, a, b, c, x[k + 12], 11, 0xe6db99e5);
        c = hh(c, d, a, b, x[k + 15], 16, 0x1fa27cf8);
        b = hh(b, c, d, a, x[k + 2], 23, 0xc4ac5665);

        a = ii(a, b, c, d, x[k + 0], 6, 0xf4292244);
        d = ii(d, a, b, c, x[k + 7], 10, 0x432aff97);
        c = ii(c, d, a, b, x[k + 14], 15, 0xab9423a7);
        b = ii(b, c, d, a, x[k + 5], 21, 0xfc93a039);
        a = ii(a, b, c, d, x[k + 12], 6, 0x655b59c3);
        d = ii(d, a, b, c, x[k + 3], 10, 0x8f0ccc92);
        c = ii(c, d, a, b, x[k + 10], 15, 0xffeff47d);
        b = ii(b, c, d, a, x[k + 1], 21, 0x85845dd1);
        a = ii(a, b, c, d, x[k + 8], 6, 0x6fa87e4f);
        d = ii(d, a, b, c, x[k + 15], 10, 0xfe2ce6e0);
        c = ii(c, d, a, b, x[k + 6], 15, 0xa3014314);
        b = ii(b, c, d, a, x[k + 13], 21, 0x4e0811a1);
        a = ii(a, b, c, d, x[k + 4], 6, 0xf7537e82);
        d = ii(d, a, b, c, x[k + 11], 10, 0xbd3af235);
        c = ii(c, d, a, b, x[k + 2], 15, 0x2ad7d2bb);
        b = ii(b, c, d, a, x[k + 9], 21, 0xeb86d391);

        a = addUnsigned(a, AA);
        b = addUnsigned(b, BB);
        c = addUnsigned(c, CC);
        d = addUnsigned(d, DD);
      }

      return (
        wordToHex(a) +
        wordToHex(b) +
        wordToHex(c) +
        wordToHex(d)
      ).toLowerCase();
    }

    const codeInput = document.getElementById("codeInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");

    async function submitCode() {
      const rawCode = codeInput.value;

      if (!rawCode) {
        statusBox.textContent = "Please enter a code.";
        resultBox.classList.add("hidden");
        return;
      }

      submitBtn.disabled = true;
      statusBox.textContent = "Generating MD5 hash...";
      resultBox.classList.add("hidden");
      resultBox.value = "";

      try {
        const hashedCode = await md5(rawCode);

        statusBox.textContent = "Requesting source...";

        const response = await fetch(
          "https://get-modmail-main-source.ipmingsum5.workers.dev/?code=" +
            encodeURIComponent(hashedCode)
        );

        const data = await response.json();

        if (data.code) {
          statusBox.textContent = "Success.";
          resultBox.value = data.code;
          resultBox.classList.remove("hidden");
        } else {
          statusBox.textContent = data.error || "No code returned.";
          resultBox.classList.add("hidden");
        }
      } catch (error) {
        statusBox.textContent = "Request failed: " + error.message;
        resultBox.classList.add("hidden");
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener("click", submitCode);

    codeInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        submitCode();
      }
    });
  </script>
</body>
</html>
