<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Log in · Ranking</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <header class="site-header">
    <div class="shell topbar">
      <a class="brand" href="./"><span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="icons.svg#arrow-up-right"></use></svg></span> Ranking<span class="brand-dot">.</span></a>
      <nav class="topnav" aria-label="Main"><a href="dashboard.html">Dashboard</a><a href="docs.html">Docs</a></nav>
      <div class="top-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Switch theme"><svg class="icon" aria-hidden="true" focusable="false"><use href="icons.svg#sun"></use></svg></button></div>
    </div>
  </header>
  <main class="page narrow">
    <section class="panel stack auth-card">
      <span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="icons.svg#arrow-up-right"></use></svg></span>
      <h1>Welcome to Ranking.</h1>
      <p>Sign in to open your workspace or request dashboard access.</p>
      <div class="stack auth-actions">
        <button type="button" class="button main-button" id="passkey-login"><svg class="icon" aria-hidden="true" focusable="false"><use href="icons.svg#passkey"></use></svg> Sign in with a passkey</button>
        <button type="button" class="button ghost" id="discord-login"><svg class="icon" aria-hidden="true" focusable="false"><use href="icons.svg#discord"></use></svg> Continue with Discord</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <a href="signup.html">Create a passkey account</a>
      <a href="dashboard.html?preview=1">Explore the dashboard preview</a>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
