name: Publish Retype
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: repo-write-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: retypeapp/action-build@latest
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_KEY }}
          RETYPE_PASSWORD: ${{ secrets.RETYPE_PASSWORD }}

      - name: Include downloadable CHATBOX examples
        run: |
          test -n "$RETYPE_OUTPUT_PATH"
          mkdir -p "$RETYPE_OUTPUT_PATH/external/chatbox"
          for file in chatbox-bot.mjs example-bot.mjs interaction-example.mjs cloudflare-worker.mjs cloudflare-wrangler.jsonc; do
            cp "external/chatbox/$file" "$RETYPE_OUTPUT_PATH/external/chatbox/$file"
          done

      - name: Include standalone obfuscator UI
        run: |
          test -n "$RETYPE_OUTPUT_PATH"
          mkdir -p "$RETYPE_OUTPUT_PATH/obfuscator"
          cp -a obfuscator/. "$RETYPE_OUTPUT_PATH/obfuscator/"

      - uses: retypeapp/action-github-pages@latest
        with:
          update-branch: true
