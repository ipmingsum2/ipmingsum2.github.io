<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090d17" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'"
    />
    <meta name="description" content="Alvin's Remote Admin — manage your Roblox experience." />
    <title>Alvin's Remote Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/config.js?v=20260919-login2"></script>
    <script type="module" src="./js/app.js?v=20260919-login2"></script>
  </head>
  <body>
    <div id="root"><div class="loading">Connecting to Remote Admin…</div></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <dialog id="confirmation">
      <form method="dialog">
        <div class="dialog-icon">!</div>
        <h2 id="confirm-title">Run command?</h2>
        <p id="confirm-detail"></p>
        <div class="dialog-actions">
          <button value="cancel" class="button secondary">Cancel</button
          ><button value="confirm" class="button primary">Confirm command</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
