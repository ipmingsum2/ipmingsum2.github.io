# Cloudflare Pages project that Roblox games call instead of *.workers.dev
# (Roblox HttpService refuses workers.dev hosts). It forwards /v1/* to the
# rp-system Worker over a service binding — no public HTTP hop in between.
name = "rp-roblox"
pages_build_output_dir = "./public"
compatibility_date = "2026-01-01"

[[services]]
binding = "API"
service = "rp-system"
