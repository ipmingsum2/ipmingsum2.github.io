<body><h1>Roleplay System game API</h1><p>This address relays requests from Roblox games to the Roleplay System API, because Roblox does not allow <code>workers.dev</code> addresses. Use it as <code>ApiUrl</code> in Roblox scripts. It serves the public API (<code>/v1/…</code>) for Roblox games, bots and websites.</p></body></html>
