<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API documentation</title>
  <script>try{var t=localStorage.getItem("rp_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b8def%27/%3E%3Cpath d=%27M16 26s7-3.500 7-8.750V11l-7-2.600L9 11v6.250C9 22.500 16 26 16 26z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=c7c6e91">
</head>
<body>
  <div class="corner-theme" id="themeCorner"></div>
  <main class="docs" id="root"></main>
  <script src="config.js?v=c7c6e91"></script>
  <script src="core.js?v=c7c6e91"></script>
  <script>$('#themeCorner').innerHTML = themeButton();</script>
  <script>
    'use strict';
    // Documented base URL is the pages.dev relay: it works from Roblox (which blocks workers.dev), bots and websites alike.
    const BASE = ROBLOX_API_URL;
    const j = (o) => JSON.stringify(o, null, 2);

    // Each endpoint: [method, path, scope, summary, {params, body, response, notes}]
    const SECTIONS = [
      ['Groups & activity', 'Read-only data about a group, its tracked members and how long they have played. All days are UTC (YYYY-MM-DD); weeks start on Monday.', [
        ['GET', '/v1/groups/{groupId}', 'read', 'Group details, roles and tracked ranks', {
          response: { id: '1234567', name: 'Sunrise Hotels', roles: [{ id: '98765', name: 'Receptionist', rank: 20, memberCount: 14 }], trackedRanks: [20, 30, 40] } }],
        ['GET', '/v1/groups/{groupId}/heatmap', 'read', 'When members play: seconds by weekday and hour', {
          params: [['days', '7–90, default 28.']],
          response: { days: 28, buckets: [0, 0, 1260, 3600, '…168 numbers'], sessions: 412 },
          notes: '`buckets` has 168 entries in UTC: index = weekday × 24 + hour, weekday 0 = Monday. Each play session is spread over the hours it covers.' }],
        ['GET', '/v1/groups/{groupId}/leaderboard/week', 'read', 'Staff of the week: top members over the last 7 full days', {
          response: { from: '2026-11-05', to: '2026-11-11', hours: [{ robloxId: '156', username: 'Builderman', roleName: 'Manager', value: 51120 }], sessions: [{ robloxId: '156', username: 'Builderman', roleName: 'Manager', value: 6 }], totalSeconds: 302400, active: 14 },
          notes: '`hours[].value` is seconds played, `sessions[].value` is completed sessions attended. Only tracked ranks count. The same numbers the weekly Discord post uses.' }],
        ['GET', '/v1/groups/{groupId}/activity', 'read', 'Leaderboard for a date range, plus a per-day series for graphs', {
          params: [['from', 'First day of the range. Default: Monday of the current week.'], ['to', 'Last day of the range. Default: today.'], ['seriesFrom', 'Start of the per-day series, if you want a longer history than the leaderboard range.']],
          response: { from: '2026-11-09', to: '2026-11-10', seriesFrom: '2026-11-09', totals: { seconds: 18420, members: 12, active: 5, online: 2 },
            leaderboard: [{ robloxId: '156', username: 'Builderman', displayName: 'Builderman', rank: 40, roleName: 'Manager', tracked: true, seconds: 7260, idleSeconds: 300, messages: 41, sessions: 3, online: true }],
            series: [{ day: '2026-11-09', seconds: 11160, idleSeconds: 420, members: 4 }] },
          notes: 'Daily total: use from = to = today. Weekly total: from = Monday, to = today.' }],
        ['GET', '/v1/groups/{groupId}/members', 'read', 'Everyone currently in a tracked rank', {
          response: { members: [{ robloxId: '156', username: 'Builderman', displayName: 'Builderman', rank: 40, roleName: 'Manager' }] } }],
        ['GET', '/v1/groups/{groupId}/members/{robloxId}', 'read', 'Full profile for one member', {
          response: { member: { robloxId: '156', username: 'Builderman', rank: 40, roleName: 'Manager' }, discord: { id: '123456789012345678', name: 'builder' },
            totals: { today: 1800, week: 7260, allTime: 392400, messages: 2210, sessions: 148 }, series: [{ day: '2026-11-10', seconds: 1800, idleSeconds: 0, messages: 12, sessions: 1 }],
            sessions: [{ start: 1794300000, end: 1794301800, seconds: 1800, idleSeconds: 0, messages: 12, live: true }], notes: [], timeOff: [], requirements: [] },
          notes: 'All durations are in seconds. `series` covers the last 12 weeks.' }],
      ]],
      ['Requirements', 'Progress against the daily or weekly activity requirement.', [
        ['GET', '/v1/groups/{groupId}/requirements', 'read', 'Live progress for the current (or a given) period', {
          params: [['type', '`weekly` (default) or `daily`.'], ['start', 'A day inside the period to inspect. Default: the current period.']],
          response: { type: 'weekly', from: '2026-11-09', to: '2026-11-15', members: [{ robloxId: '156', username: 'Builderman', rank: 40, roleName: 'Manager', seconds: 7260, required: 10800, met: false, exempt: false, discordId: '123456789012345678' }], runs: [] },
          notes: '`exempt` is true when approved time off overlaps the period. Members are sorted with those who have not met the requirement first.' }],
      ]],
      ['Time off', 'List time off, or submit a request on a member’s behalf (for example from a Discord bot). Requests made through the API always start as pending.', [
        ['GET', '/v1/groups/{groupId}/timeoff', 'read', 'All time-off entries for the group', {
          response: { timeOff: [{ id: 3, roblox_id: '156', username: 'Builderman', start_date: '2026-11-12', end_date: '2026-11-19', reason: 'Exams', status: 'pending', requested_by: 'API key "Discord bot"' }] } }],
        ['POST', '/v1/groups/{groupId}/timeoff', 'timeoff', 'Request time off', {
          body: { user: 'Builderman', startDate: '2026-11-12', endDate: '2026-11-19', reason: 'Exams' },
          response: { ok: true, id: 3, status: 'pending' }, notes: '`user` is a Roblox username or numeric user ID.' }],
      ]],
      ['Ranking', 'Changes a member’s rank through Roblox Open Cloud. Every change is written to the logs. The system never assigns rank 255, never touches the group owner, and never goes above the group’s configured maximum rank.', [
        ['POST', '/v1/groups/{groupId}/ranking', 'ranking', 'Promote, demote or set a rank', {
          body: { user: 'Builderman', action: 'set', rank: 40, reason: 'Passed training' },
          response: { user: { id: '156', name: 'Builderman', displayName: 'Builderman' }, from: { name: 'Receptionist', rank: 20 }, to: { name: 'Manager', rank: 40 } },
          notes: '`action` is `promote` (next rank up), `demote` (next rank down) or `set` (requires `rank`). Returns 404 if the user is not in the group.' }],
      ]],
      ['Logs', 'The audit trail: promotions, demotions, missed requirements, time off, applications, settings changes.', [
        ['GET', '/v1/groups/{groupId}/logs', 'read', 'Newest first, paginated', {
          params: [['type', 'Prefix filter, e.g. `rank`, `rank.promote`, `requirement.not_met`, `timeoff`, `application`.'], ['q', 'Search text (member, staff or summary).'], ['limit', '1–200, default 50.'], ['before', 'Pass the previous response’s `next` to get older entries.']],
          response: { logs: [{ id: 912, ts: 1794300000, group_id: '1234567', type: 'rank.promote', actor_type: 'user', actor_name: 'Owner', target_id: '156', target_name: 'Builderman', summary: 'Builderman was promoted from Receptionist (20) to Manager (40) — Passed training', details: { reason: 'Passed training' } }], next: 862 } }],
      ]],
      ['Logbook & news', 'Discipline records and group announcements (read-only over the API; written from the dashboard).', [
        ['GET', '/v1/groups/{groupId}/logbook', 'read', 'Warnings, strikes, suspensions, demotions, promotions, commendations', {
          params: [['rid', 'Only this member (Roblox user ID).'], ['type', '`warning`, `strike`, `suspension`, `demotion`, `promotion`, `commendation` or `termination`.'], ['active', '`1` = only entries that are neither revoked nor expired.'], ['q', 'Search text (member, reason or author).']],
          response: { entries: [{ id: 41, roblox_id: '156', username: 'Builderman', type: 'warning', reason: 'Missed a shift without notice', evidence: 'https://example.com/clip.mp4', expires_at: 1796900000, author: 'Avalynne', created_at: 1794300000, revoked_at: null, active: true, countsAsWarning: true }], activeWarnings: { 156: 1 }, types: ['warning', 'strike', 'suspension', 'demotion', 'promotion', 'commendation', 'termination'] },
          notes: '`activeWarnings` counts active warnings and strikes per member — the same numbers as the dashboard’s warning ticker. Entries are never deleted; revoked ones have `revoked_at` set.' }],
        ['GET', '/v1/groups/{groupId}/news', 'read', 'Group news posts, pinned first', {
          params: [['limit', '1–100, default 50.']],
          response: { posts: [{ id: 7, title: 'Grand reopening this Saturday!', body: 'The rooftop pool reopens…', pinned: 1, author: 'Avalynne', created_at: 1794300000 }] },
          notes: '`body` is Markdown-style text (headings, **bold**, lists, links).' }],
      ]],
      ['Blacklist', 'Players who may not join your games or apply. Managed from the dashboard; the ActivityTracker module kicks them automatically.', [
        ['GET', '/v1/groups/{groupId}/blacklist', 'read', 'Everyone currently blacklisted', {
          response: { blacklist: [{ robloxId: '156', username: 'Builderman', reason: 'Exploiting', expiresAt: null, createdAt: 1794300000 }] },
          notes: 'Only active entries (not removed, not expired). `expiresAt` is `null` for a permanent entry.' }],
        ['GET', '/v1/groups/{groupId}/blacklist/{robloxId}', 'read', 'Is this player blacklisted?', {
          response: { robloxId: '156', blacklisted: true, reason: 'Exploiting', expiresAt: null } }],
      ]],
      ['Account links', 'Discord ↔ Roblox links created through the verification game.', [
        ['GET', '/v1/links/discord/{discordId}', 'read', 'Roblox account linked to a Discord user', { response: { discordId: '123456789012345678', discordName: 'builder', robloxId: '156', robloxName: 'Builderman', linkedAt: 1794300000 }, notes: 'Returns 404 if the user has not verified.' }],
        ['GET', '/v1/links/roblox/{robloxId}', 'read', 'Discord account linked to a Roblox user', { response: { discordId: '123456789012345678', discordName: 'builder', robloxId: '156', robloxName: 'Builderman', linkedAt: 1794300000 } }],
      ]],
      ['Roblox game endpoints', 'Called from server Scripts with a key that has the `game` scope and is tied to one group — the group comes from the key, so there is no group ID in the path. The bundled ActivityTracker module and generated place files already use these.', [
        ['GET', '/v1/game/config', 'game', 'Group ID and tracked ranks for this key', { response: { groupId: '1234567', name: 'Sunrise Hotels', trackedRanks: [20, 30, 40], heartbeatSeconds: 60 } }],
        ['POST', '/v1/game/heartbeat', 'game', 'Report who is in the server (send about once a minute)', {
          body: { jobId: 'a1b2c3', players: [{ userId: 156, username: 'Builderman', displayName: 'Builderman', rank: 40, role: 'Manager', idle: false, messages: 3 }] },
          response: { ok: true, tracked: 1, kick: [{ userId: 999, reason: 'Exploiting' }] },
          notes: 'Time is credited as the gap since the previous heartbeat for the same server (`jobId`) and player, up to 180 seconds — a longer gap starts a new session. Players whose rank is not tracked are ignored. `messages` is the count since the last heartbeat. `kick` lists players in this server who are blacklisted (any rank).' }],
        ['GET', '/v1/game/blacklist/{robloxId}', 'game', 'Check a joining player against the blacklist', {
          response: { robloxId: '156', blacklisted: false, reason: null, expiresAt: null },
          notes: 'ActivityTracker calls this when a player joins and kicks them if `blacklisted` is true (turn off with `KickBlacklisted = false`).' }],
        ['POST', '/v1/game/session-end', 'game', 'A player left (credits the final partial minute)', { body: { jobId: 'a1b2c3', userId: 156 }, response: { ok: true } }],
        ['GET', '/v1/game/applications', 'game', 'Open applications and their questions for the in-game application center', {
          response: { group: 'Sunrise Hotels', applications: [{ id: '3f9a1c2b7d', group: 'Sunrise Hotels', title: 'Staff application', description: '', identity: 'username', successMessage: '', questions: [{ id: 'q1a2b3c4d', type: 'choice', label: 'What do you do if a guest is rude?', description: '', required: true, options: ['Stay calm', 'Argue back'] }] }] },
          notes: 'Correct answers and points are never included. Question types: `short`, `paragraph`, `choice`, `checkboxes`, `dropdown`, `yesno`, `number`, `scale`, `date`, `time`, `section`. Optional fields: `other` (choice/checkboxes accept a typed answer), `shuffle` (show options in random order), `minLabel`/`maxLabel` (scale), and `validation` — `{ rule, a, b, message }` with rules `gt`, `gte`, `lt`, `lte`, `eq`, `neq`, `between`, `notBetween`, `isNumber`, `isWhole`, `contains`, `notContains`, `email`, `url`, `minLen`, `maxLen`, `matches`, `notMatches` (whole answer, regular expression), `atLeast`, `atMost`, `exactly` (checkbox count).' }],
        ['POST', '/v1/game/applications/{applicationId}/submit', 'game', 'Submit an application as a verified player', {
          body: { userId: 156, username: 'Builderman', answers: { q1a2b3c4d: 'Stay calm' } }, response: { ok: true, message: 'Your application has been submitted.' },
          notes: 'Answers are keyed by question ID. Checkboxes take an array of option texts; number and scale take numbers; date is `YYYY-MM-DD`, time is `HH:MM` (24-hour). Where `other` is on, any text that is not an option is the player’s own answer and is stored as `Other: …`. Answers that break a question’s `validation` rule are rejected with that rule’s message. Returns 409 if the player already has a pending submission, and 403 if they are blacklisted.' }],
        ['POST', '/v1/game/verify', 'verify', 'Confirm a link code typed in the verification game (one game for the whole system)', { body: { code: 'K7M2QX', userId: 156, username: 'Builderman' }, response: { ok: true, discordName: 'builder' }, notes: 'Returns 404 with `{ ok: false, error }` for an invalid or expired code.' }],
      ]],
      ['Public application endpoints', 'Used by the web application form. No API key.', [
        ['GET', '/public/applications/{applicationId}', 'none', 'The form definition', { response: { open: true, application: { id: '3f9a1c2b7d', group: 'Sunrise Hotels', title: 'Staff application', identity: 'username', questions: [] } } }],
        ['POST', '/public/applications/{applicationId}/submit', 'none', 'Submit the web form', { body: { username: 'Builderman', answers: { q1a2b3c4d: 'Stay calm' } }, response: { ok: true, message: 'Your application has been submitted.' },
          notes: 'If the application requires Discord sign-in, send the token from the Discord sign-in in an `X-Public-Token` header instead of `username`.' }],
      ]],
    ];

    const curl = (m, path, body) => `curl ${m === 'GET' ? '' : `-X ${m} `}"${BASE}${path.replace('{groupId}', '1234567').replace('{robloxId}', '156').replace('{discordId}', '123456789012345678').replace('{applicationId}', '3f9a1c2b7d')}"${path.startsWith('/public') ? '' : ' \\\n  -H "Authorization: Bearer rpk_your_key"'}${body ? ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'` : ''}`;
    const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

    $('#root').innerHTML = `
      <div class="row">${icon('book', 'lg')}<div class="grow"><h1>${esc(window.RP_CONFIG.NAME || 'Roleplay System')} API</h1><p class="dim">Activity, requirements, ranking, time off, logs and account links over HTTPS + JSON.</p></div><a class="btn" href="app.html">Dashboard</a></div>

      <h2>Basics</h2>
      <p>Base URL</p><pre><code>${esc(BASE)}</code></pre>
      <p class="dim">Use this one address everywhere — Roblox games, Discord bots and websites. (Roblox blocks <code>workers.dev</code> addresses, so the API is served from <code>pages.dev</code>.)</p>
      <p><b>Authentication.</b> Create a key in the dashboard under <b>API</b> and send it on every request as either header:</p>
      <pre><code>Authorization: Bearer rpk_your_key\nX-Api-Key: rpk_your_key</code></pre>
      <p class="dim">Keys are shown once, can be limited to one group, and only work for the scopes you tick. Treat them like passwords: use them from servers and bots only, never in a web page or a Roblox LocalScript.</p>
      <div class="tbl-wrap card"><table><thead><tr><th>Scope</th><th>Allows</th></tr></thead><tbody>
        <tr><td><code>read</code></td><td>Activity, members, requirements, time off, logs, account links</td></tr>
        <tr><td><code>ranking</code></td><td>Promote, demote, set rank</td></tr>
        <tr><td><code>timeoff</code></td><td>Submit time-off requests</td></tr>
        <tr><td><code>game</code></td><td>Roblox game endpoints (key must be tied to a group)</td></tr>
        <tr><td><code>verify</code></td><td>Confirm Discord → Roblox link codes</td></tr></tbody></table></div>
      <p><b>Errors.</b> Failures return a non-2xx status and a JSON body with a human-readable message:</p>
      <pre><code>${esc(j({ error: 'This API key is missing the "ranking" scope' }))}</code></pre>
      <div class="tbl-wrap card"><table><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody>
        <tr><td>400</td><td>The request was malformed — the message says which field.</td></tr>
        <tr><td>401</td><td>Missing or invalid API key.</td></tr>
        <tr><td>403</td><td>The key lacks the scope, or is not valid for that group.</td></tr>
        <tr><td>404</td><td>Group, member, link or application not found.</td></tr>
        <tr><td>409</td><td>Conflict, e.g. a pending application already exists.</td></tr>
        <tr><td>502</td><td>Roblox Open Cloud rejected or failed the request; the message includes Roblox’s reason.</td></tr></tbody></table></div>
      <p class="dim"><b>Conventions.</b> Timestamps are Unix seconds. Durations are seconds. Days are UTC dates. Roblox and Discord IDs are strings in responses and may be sent as strings or numbers.</p>

      ${SECTIONS.map(([title, intro, eps]) => `<h2>${esc(title)}</h2><p class="dim">${md(intro)}</p>${eps.map(([m, path, scope, sum, d]) => `
        <details class="ep"><summary><span class="verb ${m}">${m}</span><code>${esc(path)}</code><span class="dim grow">${esc(sum)}</span><span class="badge">${scope === 'none' ? 'no key' : `scope: ${esc(scope)}`}</span></summary>
          <div class="body">
            ${d.notes ? `<p>${md(d.notes)}</p>` : ''}
            ${d.params ? `<div class="tbl-wrap"><table><thead><tr><th>Query parameter</th><th>Description</th></tr></thead><tbody>${d.params.map(([n, t]) => `<tr><td><code>${n}</code></td><td>${md(t)}</td></tr>`).join('')}</tbody></table></div>` : ''}
            ${d.body ? `<h3>Request body</h3><pre><code>${esc(j(d.body))}</code></pre>` : ''}
            <h3>Example</h3><pre><code>${esc(curl(m, path, d.body))}</code></pre>
            <h3>Response</h3><pre><code>${esc(j(d.response))}</code></pre>
          </div></details>`).join('')}`).join('')}

      <h2>Example: Discord bot command</h2>
      <pre><code>${esc(`// "!activity <roblox username>" — how long has someone played this week?
const res = await fetch("${BASE}/v1/groups/1234567/activity", {
  headers: { Authorization: "Bearer " + process.env.RP_API_KEY },
});
const { leaderboard } = await res.json();
const row = leaderboard.find((m) => m.username.toLowerCase() === name.toLowerCase());
reply(row ? \`\${row.username}: \${(row.seconds / 3600).toFixed(1)}h this week\` : "Not a tracked member.");`)}</code></pre>`;
  </script>
</body>
</html>
