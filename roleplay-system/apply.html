<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application</title>
  <script>try{var t=localStorage.getItem("rp_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b8def%27/%3E%3Cpath d=%27M16 26s7-3.500 7-8.750V11l-7-2.600L9 11v6.250C9 22.500 16 26 16 26z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=b81ab46">
</head>
<body>
  <div class="corner-theme" id="themeCorner"></div>
  <main class="public" id="root"><div class="empty">Loading…</div></main>
  <script src="config.js?v=b81ab46"></script>
  <script src="form-rules.js?v=b81ab46"></script>
  <script src="core.js?v=b81ab46"></script>
  <script>$('#themeCorner').innerHTML = themeButton();</script>
  <script>
    'use strict';
    const id = new URLSearchParams(location.search).get('id') || '';
    if (location.hash.startsWith('#ptoken=')) { store.set('rp_ptoken', location.hash.slice(8)); history.replaceState(null, '', location.pathname + location.search); }
    const root = $('#root');
    const fail = (msg) => { root.innerHTML = `<div class="card"><div class="empty">${icon('alert')}<div>${esc(msg)}</div></div></div>`; };


    async function render() {
      if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) return fail('This application link is not valid.');
      let app, open, me = null;
      try { ({ application: app, open } = await api(`/public/applications/${id}`)); } catch (e) { return fail(e.message); }
      document.title = `${app.title} — ${app.group}`;
      if (!open) return fail(`“${app.title}” is not accepting applications right now.`);
      if (store.get('rp_ptoken')) { try { me = await api('/public/link', { public: true }); } catch { store.set('rp_ptoken', null); } }

      const signIn = `${API_URL}/auth/discord/start?purpose=public&return=${encodeURIComponent(`apply.html?id=${id}`)}`;
      let identity;
      if (app.identity === 'discord') {
        if (!me) identity = `<div class="callout">${icon('info')}<span>This application requires a Discord account linked to Roblox.</span></div><div><a class="btn primary" href="${signIn}">${icon('discord')} Sign in with Discord</a></div>`;
        else if (!me.link) identity = `<div class="callout warn">${icon('alert')}<span>Signed in as <b>${esc(me.discord.discordName)}</b>, but no Roblox account is linked. <a href="verify.html">Link your Roblox account</a>, then reload this page.</span></div>`;
        else identity = `<div class="callout">${icon('check')}<span>Applying as <b>${esc(me.link.robloxName)}</b> (Discord: ${esc(me.discord.discordName)}).</span></div>`;
      } else {
        identity = `<label class="field">Roblox username <input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="off" placeholder="Your exact Roblox username"></label>`;
      }
      const ready = app.identity !== 'discord' || (me && me.link);

      root.innerHTML = `<div class="card"><div class="body stack gap-s"><span class="muted">${esc(app.group)}</span><h1>${esc(app.title)}</h1>${app.description ? `<p class="dim" style="white-space:pre-wrap">${esc(app.description)}</p>` : ''}</div></div>
        <form id="f" class="stack" novalidate>
          <div class="card q">${identity}</div>
          ${ready ? questionsHTML(app.questions) : ''}
          ${ready ? `<div id="err" role="alert"></div><div class="row"><button class="btn primary" style="height:42px;padding:0 22px" id="send">Submit application</button><span class="muted"><span class="req" style="color:var(--bad)">*</span> required</span></div>` : ''}
        </form>`;
      if (!ready) return;

      bindOtherInputs($('#f'));
      $('#f').onsubmit = (e) => {
        e.preventDefault();
        const form = e.target, fd = new FormData(form);
        const err = (msg, el) => { $('#err').innerHTML = `<div class="callout bad">${icon('alert')}<span>${esc(msg)}</span></div>`; el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
        const { answers, error, el: missing } = readAnswers(form, app.questions);
        if (error) return err(error, missing);
        const username = (fd.get('username') || '').toString().trim();
        if (app.identity !== 'discord' && !/^[A-Za-z0-9_]{3,20}$/.test(username)) return err('Enter your Roblox username (3–20 letters, numbers or underscores).', form.username);
        run($('#send'), async () => {
          $('#err').innerHTML = '';
          try {
            const r = await api(`/public/applications/${id}/submit`, { public: true, body: { username, answers } });
            root.innerHTML = `<div class="card"><div class="body stack" style="align-items:center;text-align:center;padding:40px 20px">${icon('check', 'lg')}<h1>Application submitted</h1><p class="dim">${esc(r.message)}</p></div></div>`;
          } catch (e2) { err(e2.message); }
        });
      };
    }
    render();
  </script>
</body>
</html>
