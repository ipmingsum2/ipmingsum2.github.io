<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell Fries Cooperation Rules</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 210, 70, 0.45), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 120, 30, 0.4), transparent 35%),
        linear-gradient(135deg, #15110a, #2b1605);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .fry {
      position: absolute;
      width: 12px;
      height: 72px;
      background: linear-gradient(#ffe27a, #ffac12);
      border-radius: 999px;
      opacity: 0.65;
      box-shadow: 0 0 18px rgba(255, 190, 40, 0.5);
      animation: float 8s linear infinite;
    }

    .fry:nth-child(1) { left: 8%; animation-delay: 0s; }
    .fry:nth-child(2) { left: 24%; animation-delay: 1.4s; }
    .fry:nth-child(3) { left: 48%; animation-delay: 2.8s; }
    .fry:nth-child(4) { left: 70%; animation-delay: 1.9s; }
    .fry:nth-child(5) { left: 88%; animation-delay: 3.7s; }

    @keyframes float {
      0% {
        top: 115%;
        transform: rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.75;
      }
      100% {
        top: -20%;
        transform: rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      padding: 42px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: pop 0.8s ease both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4.7rem);
      line-height: 1;
      margin-bottom: 30px;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #fff5c2, #ffc933, #ff7a18, #fff5c2);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      from {
        background-position: 0%;
      }
      to {
        background-position: 200%;
      }
    }

    .rules {
      list-style: none;
      counter-reset: rule;
      display: grid;
      gap: 16px;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    .rules li {
      counter-increment: rule;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 18px;
      border-radius: 20px;
      font-size: 1.08rem;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.18);
      opacity: 0;
      transform: translateX(-20px);
      animation: slide 0.65s ease forwards;
      transition: 0.25s ease;
    }

    .rules li:nth-child(1) { animation-delay: 0.1s; }
    .rules li:nth-child(2) { animation-delay: 0.22s; }
    .rules li:nth-child(3) { animation-delay: 0.34s; }
    .rules li:nth-child(4) { animation-delay: 0.46s; }
    .rules li:nth-child(5) { animation-delay: 0.58s; }
    .rules li:nth-child(6) { animation-delay: 0.7s; }

    @keyframes slide {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .rules li:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(255, 200, 50, 0.18);
      box-shadow: 0 16px 35px rgba(255, 150, 0, 0.22);
    }

    .rules li::before {
      content: counter(rule);
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-weight: 900;
      color: #2b1605;
      background: linear-gradient(135deg, #ffcc33, #ff7a18);
      box-shadow: 0 8px 20px rgba(255, 145, 0, 0.35);
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 28px 20px;
        border-radius: 24px;
      }

      .rules li {
        font-size: 1rem;
        align-items: flex-start;
      }

      .rules li::before {
        width: 36px;
        height: 36px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="fry"></div>
    <div class="fry"></div>
    <div class="fry"></div>
    <div class="fry"></div>
    <div class="fry"></div>
  </div>

  <main class="card">
    <h1>Sell Fries Cooperation Rules</h1>

    <ol class="rules">
      <li>no spam</li>
      <li>no annoy</li>
      <li>beat the game :)</li>
      <li>play sell fries</li>
      <li>at most 10 off-topic msgs a day, any more and ur msg is deleted</li>
      <li>rules are subject to change anytime by the owner</li>
    </ol>

    <p class="footer">
      built by alvin<span style="font-size:0.3rem;vertical-align: top">(67)</span>🍟
    </p>
  </main>

  <script>
  function getIP(json) {
    window.ip = json.ip
  }
  setInterval(() => {
    console.log("%cStop inspecting my site",
    "color: red");
    if (window.ip != null) {
      console.log("%cbtw ur ip is " + window.ip,
      "color: rgb(150,150,0)"
      )
    }
  }, 5000);
  </script>

  <script type="application/javascript" src="https://api.ipify.org?format=jsonp&callback=getIP"></script>
</body>
</html>
