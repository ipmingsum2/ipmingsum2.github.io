input: .
output: .retype

url: ipmingsum2.github.io

# Standalone apps copied into the output as-is by the workflow (Retype would lowercase their file names).
exclude:
  - "/roleplay-system/"

start:
  # Try the Retype Pro features
  pro: true

branding:
  title: Alvin Solutions Documentation
  label: Docs

links:
  # - text: Getting Started
    # link: https://retype.com/guides/getting-started/
  - text: Discord Server
    link: /socials/discord
    icon: comment-discussion
    target: blank

search:
  hotkeys:
    - "/"

footer:
  copyright: "&copy; Copyright {{ year }} Alvin. All rights reserved."
